# DigitalOcean App Platform app spec for the MARS acceptance demo.
# Multi-repo layout: UI (static) + API (service) + managed Postgres + PRE_DEPLOY migrations.
#
# Deploy (after GitHub repos exist and DO GitHub app is linked):
#   doctl apps create --spec .do/app.yaml
#   doctl apps update <app-id> --spec .do/app.yaml
name: mars-demo
region: nyc
features:
  - buildpack-stack=ubuntu-22
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /api
    - component:
        name: web
      match:
        path:
          prefix: /
services:
  - name: api
    github:
      repo: hugocorbucci/mars-demo-api
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: npm start
    health_check:
      http_path: /api/health
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      # Demo toggle for scenario 2a (crash-after-usage). Leave "false" for healthy deploys.
      - key: DEMO_CRASH_AFTER_REQUESTS
        scope: RUN_TIME
        value: "0"
static_sites:
  - name: web
    github:
      repo: hugocorbucci/mars-demo-ui
      branch: main
      deploy_on_push: true
    environment_slug: html
    source_dir: /public
    index_document: index.html
    error_document: 404.html
    envs:
      - key: API_BASE
        scope: BUILD_TIME
        value: /api
jobs:
  - name: db-migrate
    kind: PRE_DEPLOY
    github:
      repo: hugocorbucci/mars-demo-db
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    source_dir: /
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: npm run migrate
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
databases:
  # Dev managed Postgres attached to this app (customer-like App Platform pattern).
  # Promote to production later with production: true + cluster_name.
  - name: db
    engine: PG
    version: "16"
    production: false
