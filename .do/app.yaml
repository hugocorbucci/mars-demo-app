# GENERATED FILE — do not edit by hand.
# Source: .do/base.yaml + components/*/.do/component.yaml
# Regenerate: npm run compose
name: mars-demo
region: tor
features:
  - buildpack-stack=ubuntu-22
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
ingress:
  rules:
    - component:
        name: api
      match:
        path:
          prefix: /api
    - component:
        name: web
      match:
        path:
          prefix: /
static_sites:
  - name: web
    github:
      repo: mars-demo-app/mars-demo-ui
      branch: main
      deploy_on_push: true
    environment_slug: html
    source_dir: /public
    index_document: index.html
    error_document: 404.html
    envs:
      - key: API_BASE
        scope: BUILD_TIME
        value: /api
services:
  - name: api
    github:
      repo: mars-demo-app/mars-demo-api
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    run_command: npm start
    health_check:
      http_path: /api/health
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: '8080'
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DEMO_CRASH_AFTER_REQUESTS
        scope: RUN_TIME
        value: '0'
databases:
  - name: db
    engine: PG
    version: '16'
    production: false
